<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#0E2A33"/>
      <stop offset="50%" stop-color="#2A5563"/>
      <stop offset="100%" stop-color="#3D7080"/>
    </linearGradient>
    <linearGradient id="mountain-back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A3D4A" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1A3D4A" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="mountain-mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0E2A33"/>
      <stop offset="100%" stop-color="#0A1F26"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.7" cy="0.3" r="0.18">
      <stop offset="0%"  stop-color="#F4C460" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#E8A828" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#E8A828" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lantern" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#F4C460"/>
      <stop offset="70%" stop-color="#E8A828"/>
      <stop offset="100%" stop-color="#C98B12"/>
    </radialGradient>
  </defs>

  <!-- sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>
  <!-- moon / sun glow -->
  <rect width="1600" height="900" fill="url(#sun)"/>
  <circle cx="1180" cy="240" r="58" fill="#FBE0DD" opacity="0.92"/>

  <!-- distant mountains (back layer) -->
  <path fill="url(#mountain-back)"
        d="M0,640 L120,540 L220,580 L320,500 L440,560 L540,490 L640,540 L760,470 L880,520 L1020,480 L1140,540 L1260,490 L1380,540 L1500,500 L1600,540 L1600,900 L0,900 Z"/>

  <!-- mid mountains -->
  <path fill="url(#mountain-mid)" opacity="0.85"
        d="M0,720 L150,640 L260,700 L380,620 L520,680 L640,620 L780,680 L920,620 L1060,690 L1200,620 L1340,680 L1480,640 L1600,690 L1600,900 L0,900 Z"/>

  <!-- pagoda — left, smaller -->
  <g transform="translate(280, 560)" fill="#0A1F26" opacity="0.92">
    <!-- 3-tier roofs -->
    <path d="M-95,-130 Q-90,-150 -65,-150 L65,-150 Q90,-150 95,-130 Q105,-120 105,-110 L-105,-110 Q-105,-120 -95,-130 Z"/>
    <rect x="-32" y="-110" width="64" height="6" rx="2"/>
    <path d="M-80,-90 Q-75,-105 -55,-105 L55,-105 Q75,-105 80,-90 Q88,-82 88,-72 L-88,-72 Q-88,-82 -80,-90 Z"/>
    <rect x="-26" y="-72" width="52" height="6" rx="2"/>
    <path d="M-65,-55 Q-60,-66 -45,-66 L45,-66 Q60,-66 65,-55 Q72,-48 72,-40 L-72,-40 Q-72,-48 -65,-55 Z"/>
    <rect x="-22" y="-40" width="44" height="40" rx="2"/>
    <!-- pillars -->
    <rect x="-26" y="0" width="6" height="56"/>
    <rect x="20" y="0" width="6" height="56"/>
    <!-- base -->
    <rect x="-46" y="56" width="92" height="8"/>
    <rect x="-58" y="64" width="116" height="8"/>
    <!-- spire -->
    <path d="M-3,-150 L3,-150 L0,-180 Z"/>
    <circle cx="0" cy="-148" r="3"/>
  </g>

  <!-- pagoda — center, large hero -->
  <g transform="translate(800, 520)" fill="#0A1F26">
    <!-- top finial -->
    <path d="M-4,-260 L4,-260 L0,-310 Z" fill="#E8A828"/>
    <circle cx="0" cy="-255" r="5" fill="#E8A828"/>
    <!-- 4-tier curved roofs -->
    <path d="M-150,-260 Q-140,-285 -110,-285 L110,-285 Q140,-285 150,-260 Q165,-248 165,-235 L-165,-235 Q-165,-248 -150,-260 Z"/>
    <rect x="-50" y="-235" width="100" height="8" rx="2"/>
    <path d="M-130,-215 Q-120,-238 -95,-238 L95,-238 Q120,-238 130,-215 Q145,-205 145,-192 L-145,-192 Q-145,-205 -130,-215 Z"/>
    <rect x="-44" y="-192" width="88" height="8" rx="2"/>
    <path d="M-110,-172 Q-100,-193 -80,-193 L80,-193 Q100,-193 110,-172 Q122,-162 122,-150 L-122,-150 Q-122,-162 -110,-172 Z"/>
    <rect x="-36" y="-150" width="72" height="8" rx="2"/>
    <path d="M-90,-130 Q-82,-150 -65,-150 L65,-150 Q82,-150 90,-130 Q100,-122 100,-110 L-100,-110 Q-100,-122 -90,-130 Z"/>
    <!-- main body -->
    <rect x="-80" y="-110" width="160" height="100" rx="3"/>
    <!-- doorway (cut-out via lighter rect) -->
    <path d="M-22,-50 Q-22,-72 0,-72 Q22,-72 22,-50 L22,-10 L-22,-10 Z" fill="#E8A828" opacity="0.85"/>
    <!-- columns visible at sides -->
    <rect x="-72" y="-100" width="6" height="86" fill="#1A3D4A"/>
    <rect x="66" y="-100" width="6" height="86" fill="#1A3D4A"/>
    <!-- platform base -->
    <rect x="-100" y="-10" width="200" height="14"/>
    <rect x="-120" y="4"  width="240" height="14"/>
    <rect x="-140" y="18" width="280" height="12"/>
    <!-- lanterns hanging -->
    <line x1="-115" y1="-235" x2="-115" y2="-205" stroke="#E8A828" stroke-width="1.5"/>
    <ellipse cx="-115" cy="-195" rx="10" ry="12" fill="url(#lantern)"/>
    <line x1="115" y1="-235" x2="115" y2="-205" stroke="#E8A828" stroke-width="1.5"/>
    <ellipse cx="115" cy="-195" rx="10" ry="12" fill="url(#lantern)"/>
  </g>

  <!-- pagoda — right, smaller -->
  <g transform="translate(1280, 580)" fill="#0A1F26" opacity="0.92">
    <path d="M-90,-120 Q-85,-140 -60,-140 L60,-140 Q85,-140 90,-120 Q100,-110 100,-100 L-100,-100 Q-100,-110 -90,-120 Z"/>
    <rect x="-30" y="-100" width="60" height="6" rx="2"/>
    <path d="M-75,-82 Q-70,-98 -50,-98 L50,-98 Q70,-98 75,-82 Q82,-74 82,-64 L-82,-64 Q-82,-74 -75,-82 Z"/>
    <rect x="-24" y="-64" width="48" height="6" rx="2"/>
    <path d="M-60,-46 Q-55,-58 -40,-58 L40,-58 Q55,-58 60,-46 Q66,-40 66,-32 L-66,-32 Q-66,-40 -60,-32 Z"/>
    <rect x="-18" y="-32" width="36" height="32" rx="2"/>
    <rect x="-22" y="0" width="4" height="50"/>
    <rect x="18" y="0" width="4" height="50"/>
    <rect x="-40" y="50" width="80" height="8"/>
    <rect x="-52" y="58" width="104" height="8"/>
    <path d="M-3,-140 L3,-140 L0,-168 Z" fill="#E8A828"/>
  </g>

  <!-- foreground silhouette: bamboo + grass -->
  <g fill="#0A1F26" opacity="0.95">
    <rect x="80"   y="820" width="6" height="80"/>
    <rect x="86"   y="780" width="2" height="50"/>
    <path d="M86 770 q12 -4 18 6 q-14 4 -18 -6 z" fill="#1A3D4A"/>
    <rect x="240"  y="830" width="5" height="70"/>
    <path d="M243 820 q10 -3 16 5 q-12 4 -16 -5 z" fill="#1A3D4A"/>
    <rect x="1440" y="810" width="6" height="90"/>
    <rect x="1446" y="770" width="2" height="60"/>
    <path d="M1446 760 q12 -4 18 6 q-14 4 -18 -6 z" fill="#1A3D4A"/>
    <rect x="1520" y="830" width="5" height="70"/>
  </g>

  <!-- soft fog / atmospheric depth -->
  <rect width="1600" height="900" fill="url(#sky)" opacity="0.18"/>
</svg>
